name: habit_checkin
description: "An iOS-first personal goal tracker with local SQLite history."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  characters: ^1.4.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: 11.2.0
  flutter_timezone: ^5.1.1
  image: ^4.12.0
  image_picker: ^1.2.4
  path: ^1.9.1
  path_provider: ^2.1.6
  timezone: ^0.11.1
  uuid: ^4.6.0
  xingyuan_core:
    path: packages/xingyuan_core

dev_dependencies:
  xingyuan_assistant_eval:
    path: tool/assistant_eval
  xingyuan_server:
    path: server
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
